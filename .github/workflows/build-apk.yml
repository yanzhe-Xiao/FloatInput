name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Locate and Rename APKs
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/ \;
          ls -lh output_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FloatInput-APKs
          path: output_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          generate_release_notes: true
